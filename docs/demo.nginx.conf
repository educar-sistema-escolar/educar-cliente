# Dedicated HTTPS host only. Replace domain and existing certificate paths.
server {
    listen 443 ssl;
    server_name demo.educar.example;
    ssl_certificate /etc/letsencrypt/live/demo.educar.example/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/demo.educar.example/privkey.pem;
    root /srv/educar-demo;
    index index.html;

    # Inherited by SPA routes AND assets; never disable auth in a child location.
    auth_basic "Presentacion Educar";
    auth_basic_user_file /etc/nginx/educar-demo.htpasswd;
    add_header Cache-Control "private, no-store" always;
    add_header X-Robots-Tag "noindex, nofollow" always;

    location / {
        try_files $uri $uri/ /index.html;
    }
}
